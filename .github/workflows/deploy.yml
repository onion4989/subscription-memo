name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 本番へ出す前の自動チェック。e2e は DB と SMTP が必要なためローカル実行のままにする
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma generate は接続せず型を作るだけ。実 DB には使わないダミー値
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 検索避けはビルド時に焼き付く。変数未設定なら true（検索に載せない）
          build-args: |
            BLOCK_SEARCH_INDEXING=${{ vars.BLOCK_SEARCH_INDEXING || 'true' }}
          tags: |
            ghcr.io/onion4989/subscription-memo:latest
            ghcr.io/onion4989/subscription-memo:${{ github.sha }}

      - name: Trigger Dokploy deploy
        if: success()
        env:
          DOKPLOY_DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK_URL is not set. Skipping webhook."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK_URL"
