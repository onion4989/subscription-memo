services:
  db:
    image: postgres:16-alpine
    container_name: subscription-memo-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscription_memo_dev
    volumes:
      - subscription_memo_pgdata:/var/lib/postgresql/data

volumes:
  subscription_memo_pgdata:
